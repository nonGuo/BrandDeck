<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="BrandDeck">
  <title>BrandDeck</title>
  <!-- Three stacked 16:9 slides: a deck. The back cards are muted, the front
       card carries the brand accent bar and two text lines. -->
  <rect x="7" y="3" width="22" height="12.5" rx="1.6" fill="none" stroke="currentColor" stroke-opacity="0.28" stroke-width="1.4"/>
  <rect x="4.5" y="6.5" width="22" height="12.5" rx="1.6" fill="none" stroke="currentColor" stroke-opacity="0.5" stroke-width="1.4"/>
  <rect x="2" y="10" width="22" height="12.5" rx="1.6" fill="currentColor" fill-opacity="0.1" stroke="currentColor" stroke-width="1.6"/>
  <rect x="4.4" y="12.4" width="2.2" height="7.7" rx="1.1" fill="currentColor"/>
  <rect x="8.4" y="13.4" width="12.4" height="1.9" rx="0.95" fill="currentColor" fill-opacity="0.85"/>
  <rect x="8.4" y="16.7" width="9.2" height="1.6" rx="0.8" fill="currentColor" fill-opacity="0.5"/>
  <rect x="8.4" y="19.4" width="6.4" height="1.6" rx="0.8" fill="currentColor" fill-opacity="0.3"/>
</svg>
